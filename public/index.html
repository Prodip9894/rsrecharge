<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSRecharge - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:#f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-box { background:#fff; padding:40px; border-radius:12px; box-shadow:0 2px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; }
        .login-box h1 { text-align:center; color:#0d1b2a; margin-bottom:8px; font-size:24px; }
        .login-box p { text-align:center; color:#666; margin-bottom:24px; font-size:14px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; margin-bottom:6px; font-weight:600; color:#333; font-size:14px; }
        .form-group input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
        .form-group input:focus { outline:none; border-color:#0a9396; }
        .btn { width:100%; padding:12px; background:#0a9396; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
        .btn:hover { background:#005f73; }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }
        .links { text-align:center; margin-top:16px; }
        .links a { color:#0a9396; text-decoration:none; font-size:14px; }
        .msg { padding:10px; border-radius:8px; margin-bottom:16px; display:none; font-size:14px; }
        .msg.error { display:block; background:#fee; color:#c00; border:1px solid #fcc; }
        .msg.success { display:block; background:#efe; color:#060; border:1px solid #cfc; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>&#9889; RSRecharge</h1>
        <p>Sign in to your account</p>
        <div class="msg" id="msg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email / Mobile</label>
                <input type="text" id="identifier" placeholder="Enter email or mobile" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Sign In</button>
        </form>
        <div class="links">
            <a href="/login.html">Register New Account</a>
        </div>
    </div>
    <script>
        var msg = document.getElementById('msg');
        function showMsg(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                var res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: document.getElementById('identifier').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                var data = await res.json();
                if (res.ok && data.success) {
                    var d = data.data || data;
                    localStorage.setItem('token', d.token);
                    localStorage.setItem('user', JSON.stringify(d.user));
                    showMsg('Login successful! Redirecting...', 'success');
                    setTimeout(function() { window.location.href = '/dashboard.html'; }, 500);
                } else {
                    showMsg(data.message || 'Login failed', 'error');
                    btn.disabled = false; btn.textContent = 'Sign In';
                }
            } catch(err) {
                showMsg('Server error. Try again.', 'error');
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
