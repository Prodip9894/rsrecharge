<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RSRecharge - Multi Recharge & Bill Payment Platform">
    <title>RSRecharge - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=2">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <div id="app" class="app-layout">
        <aside class="app-sidebar" id="sidebar" style="display:none">
            <div class="sidebar-brand">
                <i class="fas fa-bolt"></i>
                <span class="sidebar-brand-text">RSRecharge</span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="sidebarUser"></div>
            </div>
        </aside>

        <main class="app-main">
            <header class="app-header" id="topbar" style="display:none"></header>
            <div class="app-content" id="pageContent"></div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/js/app.js?v=3"></script>
</body>
</html>
