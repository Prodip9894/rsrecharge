<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — RSRecharge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:#070b14;position:relative;perspective:1000px;overflow-x:hidden}
body::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,rgba(14,165,233,0.15) 0%,rgba(7,11,20,0.85) 100%);z-index:0}
.glow-card-wrapper{position:relative;border-radius:30px;padding:2px;background:linear-gradient(135deg,rgba(56,189,248,0.8),rgba(99,102,241,0.3),rgba(2,132,199,0.9),rgba(168,85,247,0.4));background-size:300% 300%;animation:neonGlow 6s ease infinite;box-shadow:0 0 25px rgba(56,189,248,0.35),0 0 50px rgba(2,132,199,0.2);transition:all 0.3s ease;z-index:1}
.glow-card-wrapper:hover{box-shadow:0 0 35px rgba(56,189,248,0.6),0 0 70px rgba(99,102,241,0.4)}
@keyframes neonGlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{background:rgba(15,23,42,0.82);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:28px;width:700px;max-width:100%;min-height:420px;display:flex;overflow:hidden;position:relative}
.form-container{width:50%;padding:36px 28px;display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,0.015)}
.form-container h1{font-size:24px;font-weight:800;margin-bottom:8px;text-align:center;color:#ffffff;letter-spacing:-0.5px}
.social-icons{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.social-icons a{border:1px solid rgba(255,255,255,0.14);border-radius:50%;display:flex;justify-content:center;align-items:center;width:34px;height:34px;color:#cbd5e1;text-decoration:none;background:rgba(255,255,255,0.04);backdrop-filter:blur(8px);transition:all 0.3s ease;font-size:13px}
.social-icons a:hover{background:rgba(2,132,199,0.25);border-color:#38bdf8;color:#ffffff;transform:translateY(-2px);box-shadow:0 0 12px rgba(56,189,248,0.4)}
.form-container>span{font-size:11.5px;text-align:center;margin-bottom:14px;color:#94a3b8;display:block;font-weight:500}
.input-group{position:relative;margin-bottom:13px;background:rgba(15,23,42,0.6);border-radius:20px;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);transition:all 0.25s ease}
.input-group:focus-within{background:rgba(15,23,42,0.85);border-color:rgba(56,189,248,0.8);box-shadow:0 0 12px rgba(56,189,248,0.3)}
.input-group i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#38bdf8;font-size:13.5px}
.form-container input{background:transparent;border:none;padding:11px 14px 11px 40px;width:100%;border-radius:20px;outline:none;font-size:12.5px;color:#ffffff;font-weight:500}
.form-container input::placeholder{color:#64748b}
.forgot-pass{color:#94a3b8;font-size:11.5px;text-decoration:none;margin-bottom:14px;text-align:center;display:block;font-weight:500;transition:color 0.2s ease}
.forgot-pass:hover{color:#38bdf8}
.btn-login{border-radius:20px;border:1px solid rgba(255,255,255,0.25);background:linear-gradient(135deg,#0284c7 0%,#0369a1 100%);color:#ffffff;font-size:11.5px;font-weight:700;padding:11px;letter-spacing:0.8px;text-transform:uppercase;cursor:pointer;width:100%;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(2,132,199,0.4)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(2,132,199,0.6);filter:brightness(1.1)}
.overlay-container{width:50%;background:linear-gradient(135deg,rgba(15,23,42,0.8) 0%,rgba(8,14,28,0.95) 100%);backdrop-filter:blur(20px);color:#ffffff;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px;border-top-left-radius:75px;border-bottom-left-radius:75px;position:relative;border-left:1px solid rgba(255,255,255,0.1)}
.brand-logo-frame{display:inline-flex;align-items:center;justify-content:center;max-width:180px;max-height:85px;margin-bottom:16px;padding:8px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.35);backdrop-filter:blur(8px)}
.brand-logo{max-width:100%;max-height:65px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4))}
.overlay h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-0.3px}
.overlay p{font-size:11.5px;line-height:1.55;color:#94a3b8;padding:0 6px}
.alert{padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:11.5px;text-align:center;backdrop-filter:blur(6px)}
.alert-danger{background:rgba(239,68,68,0.18);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.support-text{font-size:11px;text-align:center;margin-top:14px;color:#94a3b8;letter-spacing:0.2px}
.tab-switch{display:flex;justify-content:center;gap:16px;margin-bottom:18px}
.tab-switch a{color:#64748b;font-size:12px;font-weight:600;text-decoration:none;padding-bottom:4px;border-bottom:2px solid transparent;transition:all 0.2s}
.tab-switch a.active{color:#38bdf8;border-bottom-color:#38bdf8}
#registerForm{display:none}
@media(max-width:768px){.container{flex-direction:column;width:100%;border-radius:22px}.glow-card-wrapper{width:95%;border-radius:24px}.form-container,.overlay-container{width:100%}.overlay-container{border-radius:0;padding:30px 20px;border-left:none;border-top:1px solid rgba(255,255,255,0.1)}}
</style>
</head>
<body>
<div class="glow-card-wrapper" id="tilt-card">
<div class="container">
<div class="form-container">
<div class="tab-switch">
<a href="#" id="tabLogin" class="active" onclick="showTab('login')">Sign In</a>
<a href="#" id="tabRegister" onclick="showTab('register')">Sign Up</a>
</div>

<div id="loginForm">
<h1>Welcome Back</h1>
<span>Enter your credentials to access your account</span>
<div id="loginError" class="alert alert-danger" style="display:none"></div>
<form onsubmit="handleLogin(event)">
<div class="input-group"><i class="bi bi-person-fill"></i><input type="text" id="loginEmail" placeholder="Username / Mobile / Email" required autofocus></div>
<div class="input-group"><i class="bi bi-lock-fill"></i><input type="password" id="loginPassword" placeholder="Password" required></div>
<a href="#" class="forgot-pass">Forgot Your Password?</a>
<button type="submit" class="btn-login" id="loginBtn">Sign In</button>
</form>
<p class="support-text">Need help? <span class="text-white fw-bold">+91 9641742208</span></p>
</div>

<div id="registerForm">
<h1>Create Account</h1>
<span>Register as a new retailer or distributor</span>
<div id="regError" class="alert alert-danger" style="display:none"></div>
<form onsubmit="handleRegister(event)">
<div class="input-group"><i class="bi bi-person-fill"></i><input type="text" id="regName" placeholder="Full Name" required></div>
<div class="input-group"><i class="bi bi-envelope-fill"></i><input type="email" id="regEmail" placeholder="Email Address" required></div>
<div class="input-group"><i class="bi bi-phone-fill"></i><input type="tel" id="regMobile" placeholder="Mobile Number" required></div>
<div class="input-group"><i class="bi bi-lock-fill"></i><input type="password" id="regPassword" placeholder="Create Password" required></div>
<div class="input-group"><i class="bi bi-person-badge-fill"></i><input type="text" id="regReferral" placeholder="Referral Code (Optional)"></div>
<button type="submit" class="btn-login" id="regBtn">Create Account</button>
</form>
</div>
</div>

<div class="overlay-container">
<div class="overlay">
<div class="brand-logo-frame">
<span style="font-size:2.5rem;font-weight:800;color:#38bdf8;line-height:1">&#9889;</span>
</div>
<h1>RSRecharge</h1>
<p>Enter your credentials to securely access and manage your recharge terminal.</p>
</div>
</div>
</div>
</div>

<script>
const card=document.getElementById('tilt-card');
card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,cx=r.width/2,cy=r.height/2;card.style.transform=`rotateX(${(y-cy)/28}deg) rotateY(${(cx-x)/28}deg)`});
card.addEventListener('mouseleave',()=>{card.style.transform='rotateX(0) rotateY(0)'});

function showTab(t){
if(t==='login'){document.getElementById('loginForm').style.display='block';document.getElementById('registerForm').style.display='none';document.getElementById('tabLogin').classList.add('active');document.getElementById('tabRegister').classList.remove('active')}
else{document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';document.getElementById('tabLogin').classList.remove('active');document.getElementById('tabRegister').classList.add('active')}
}

function showError(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block'}
function hideError(id){document.getElementById(id).style.display='none'}

async function handleLogin(e){
e.preventDefault();hideError('loginError');
const identifier=document.getElementById('loginEmail').value.trim();
const password=document.getElementById('loginPassword').value.trim();
const btn=document.getElementById('loginBtn');
btn.textContent='Signing In...';btn.disabled=true;
try{
const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password})});
const d=await r.json();
if(d.success){localStorage.setItem('token',d.data.token);localStorage.setItem('user',JSON.stringify(d.data.user));window.location.href='/dashboard.html'}
else{showError('loginError',d.message||'Invalid credentials');btn.textContent='Sign In';btn.disabled=false}
}catch(err){showError('loginError','Connection failed. Retrying...');btn.textContent='Sign In';btn.disabled=false}
}

async function handleRegister(e){
e.preventDefault();hideError('regError');
const name=document.getElementById('regName').value.trim();
const email=document.getElementById('regEmail').value.trim();
const mobile=document.getElementById('regMobile').value.trim();
const password=document.getElementById('regPassword').value.trim();
const referral=document.getElementById('regReferral').value.trim();
const btn=document.getElementById('regBtn');
btn.textContent='Creating Account...';btn.disabled=true;
try{
const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,mobile,password,referred_by:referral||undefined,role:'RETAILER'})});
const d=await r.json();
if(d.success){showTab('login');showError('regError','');document.getElementById('loginError').className='alert alert-success';document.getElementById('loginError').textContent='Account created! Please sign in.';document.getElementById('loginError').style.display='block'}
else{showError('regError',d.message||'Registration failed');btn.textContent='Create Account';btn.disabled=false}
}catch(err){showError('regError','Connection failed. Retrying...');btn.textContent='Create Account';btn.disabled=false}
}
</script>
</body>
</html>
